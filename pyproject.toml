[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "factorforge"
version = "0.1.0"
description = "LLM-assisted quantitative factor research MVP for A-share research"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "FactorForge Contributors" }]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scipy>=1.11,<2",
  "pydantic>=2.6,<3",
  "PyYAML>=6.0,<7",
  "matplotlib>=3.8,<4",
  "openai>=1.30,<3",
]

[project.optional-dependencies]
ui = ["streamlit>=1.35,<2", "plotly>=5.20,<7"]
realdata = ["akshare>=1.14"]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7"]
all = [
  "streamlit>=1.35,<2",
  "plotly>=5.20,<7",
  "akshare>=1.14",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
]

[project.scripts]
factorforge = "factorforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["factorforge"]
omit = ["*/app.py"]

